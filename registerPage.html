<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Donasiku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="registerStyle.css">
</head>

<body>
    <div class="container">
        <div class="left-side">
            <img src="img/logingambar.png" alt="">
            <div class="overlay"></div>
        </div>

        <div class="right-side">

            <div class="register-card">

                <!-- LOGO -->
                <div class="logo">
                    <img src="img/logo.png" alt="Logo">
                </div>

                <h2 class="logo-text">
                    <span class="bold">Donasi</span><span class="regular">ku</span>
                </h2>

                <!-- WELCOME -->
                <div class="register-text">
                    <h1>Daftar Akun</h1>
                </div>

                <!-- FORM -->
                <form id="registerForm">
                    <!-- Email dan No hape -->
                    <div class="form-group">
                        <label>Email atau Nomor HP</label>

                        <div class="input-box">
                            <input type="text" id="email" placeholder="Masukkan email atau nomor HP">
                        </div>
                    </div>

                    <!-- Nama Lengkap -->
                    <div class="form-group">
                        <label>Nama Lengkap</label>

                        <div class="input-box">
                            <input type="text" id="namaLengkap" placeholder="Masukkan Nama Lengkap Anda">
                        </div>
                    </div>
                    <!-- Password -->
                    <div class="form-group">

                        <label>Password</label>

                        <div class="input-box">

                            <input type="password" id="password" placeholder="Masukkan password">
                            <span class="toggle-password" id="togglePassword">
                                <i class="fa-regular fa-eye-slash"></i>
                            </span>

                        </div>

                    </div>
                    <div class="form-group">

                        <label>Konfirmasi Password</label>

                        <div class="input-box">

                            <input type="password" id="confirmed-password" placeholder="Ulangi password">

                            <span class="toggle-password" id="toggleConfirmedPw">
                                <i class="fa-regular fa-eye-slash"></i>
                            </span>

                        </div>

                    </div>

                    <!-- EXTRA -->
                    <div class="form-extra-register">
                        <label class="agreement">
                            <input id="checkboxAgreement" type="checkbox">
                            <span>Saya setuju dengan <a class="terms-condition" href="#">Syarat & Ketentuan</a></span>
                        </label>

                        <p class="agreeText">
                            Dengan menekan tombol “Daftar” di bawah ini, saya setuju
                            dengan <a class="terms-condition" href="#">Syarat dan Ketentuan</a>
                        </p>
                    </div>

                    <!-- BUTTON -->
                    <button type="submit" class="btn-login" onclick="window.location.href='login.html'">
                        Daftar
                    </button>
                    <!-- SIGNUP -->
                    <div class="signup">
                        <span>Sudah punya Akun?</span>
                        <a href="login.html">Masuk sekarang</a>
                    </div>

                </form>

            </div>

        </div>
    </div>
    <script src="script.js"></script>
    <script src="registerScript.js"></script>

</body>

</html>
